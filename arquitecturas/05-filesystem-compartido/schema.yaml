title: "05 - File System Compartido (FSS)"
description: "Despliega una arquitectura web segura sumando un OCI File Storage Service (NFS Serverless). Permite persistir y compartir archivos estáticos entre múltiples webservers simultáneamente."
schemaVersion: 1.1.0
version: "20250101"
locale: "es"

logoUrl: "https://raw.githubusercontent.com/jesmonsa/oracle-cloud-latam/main/docs/logo.png"

variableGroups:
  - title: "Información del Tenancy"
    visible: false
    variables:
      - tenancy_ocid
      - region
      - current_user_ocid

  - title: "Configuración General"
    visible: true
    variables:
      - compartment_ocid
      - proyecto
      - ambiente
      - propietario

  - title: "Configuración de Red (VCN)"
    visible: true
    variables:
      - vcn_cidr
      - subnet_publica_cidr
      - subnet_privada_cidr

  - title: "Configuración de Cómputo"
    visible: true
    variables:
      - ssh_public_key
      - shape_webserver
      - ocpus_webserver
      - memoria_webserver_gb
      - imagen_os

  - title: "Seguridad y Accesos"
    visible: true
    variables:
      - ssh_cidr_permitido
      - habilitar_nsg

  - title: "Opciones Avanzadas"
    visible: true
    variables:
      - habilitar_baseline_seguridad

variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment de Destino"
    required: true

  proyecto:
    type: string
    title: "Nombre del Proyecto"
    default: "miproyecto"
    required: true
    pattern: "^[a-z][a-z0-9-]{1,14}$"

  ambiente:
    type: enum
    title: "Ambiente de Despliegue"
    enum:
      - "produccion"
      - "staging"
      - "desarrollo"
      - "demo"
    default: "desarrollo"
    required: true

  propietario:
    type: string
    title: "Propietario"
    default: "admin"
    required: true

  vcn_cidr:
    type: string
    title: "CIDR de la VCN"
    default: "10.0.0.0/16"
    required: true

  subnet_publica_cidr:
    type: string
    title: "CIDR Subred Pública"
    default: "10.0.1.0/24"
    required: true

  subnet_privada_cidr:
    type: string
    title: "CIDR Subred Privada"
    default: "10.0.2.0/24"
    required: true

  ssh_public_key:
    type: string
    title: "Llave Pública SSH"
    required: true

  shape_webserver:
    type: oci:core:instanceshape:name
    title: "Shape del Servidor"
    default: "VM.Standard.E4.Flex"
    required: true
    dependsOn:
      compartmentId: compartment_ocid

  ocpus_webserver:
    type: number
    title: "OCPUs (por VM)"
    default: 1
    required: true

  memoria_webserver_gb:
    type: number
    title: "Memoria RAM (GB) (por VM)"
    default: 8
    required: true

  imagen_os:
    type: string
    title: "OCID de la Imagen OS (Opcional)"
    default: ""
    required: false

  ssh_cidr_permitido:
    type: string
    title: "CIDR Permitido para Bastion SSH"
    default: "0.0.0.0/0"
    required: true

  habilitar_nsg:
    type: boolean
    title: "Usar Network Security Groups (NSG)"
    default: true

  habilitar_baseline_seguridad:
    type: boolean
    title: "Activar Baseline de Seguridad OCI"
    default: false
