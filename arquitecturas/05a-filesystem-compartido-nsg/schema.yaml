title: "05a - File System Compartido (FSS) con NSGs"
description: "Idéntica a la 05 pero demostrando el uso extensivo de Network Security Groups (NSGs) aplicados a File Storage y Webservers en la Subred Privada."
schemaVersion: 1.1.0
version: "20250101"
locale: "es"

logoUrl: "https://raw.githubusercontent.com/jesmonsa/oracle-cloud-latam/main/docs/logo.png"

variableGroups:
  - title: "Información del Tenancy"
    visible: false
    variables:
      - tenancy_ocid
      - region
      - current_user_ocid

  - title: "Configuración General"
    visible: true
    variables:
      - compartment_ocid
      - proyecto
      - ambiente
      - propietario

  - title: "Configuración de Red (VCN)"
    visible: true
    variables:
      - vcn_cidr
      - subnet_publica_cidr
      - subnet_privada_cidr

  - title: "Configuración de Cómputo"
    visible: true
    variables:
      - ssh_public_key
      - shape_webserver
      - ocpus_webserver
      - memoria_webserver_gb
      - imagen_os

  - title: "Seguridad y Accesos"
    visible: true
    variables:
      - ssh_cidr_permitido
      - habilitar_nsg

  - title: "Opciones Avanzadas"
    visible: true
    variables:
      - habilitar_baseline_seguridad

variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment de Destino"
    description: "Compartment donde se crearán todos los recursos de esta arquitectura"
    required: true

  proyecto:
    type: string
    title: "Nombre del Proyecto"
    description: "Prefijo usado en el nombre de todos los recursos. Sin espacios, máx 15 caracteres"
    default: "miproyecto"
    required: true
    pattern: "^[a-z][a-z0-9-]{1,14}$"

  ambiente:
    type: enum
    title: "Ambiente de Despliegue"
    description: "Ambiente donde se despliega esta arquitectura"
    enum:
      - "produccion"
      - "staging"
      - "desarrollo"
      - "demo"
    default: "desarrollo"
    required: true

  propietario:
    type: string
    title: "Propietario"
    description: "E-mail o nombre del propietario de los recursos"
    default: "admin"
    required: true

  vcn_cidr:
    type: string
    title: "CIDR de la VCN"
    description: "Espacio de direcciones para la Red Virtual"
    default: "10.0.0.0/16"
    required: true

  subnet_publica_cidr:
    type: string
    title: "CIDR Subred Pública"
    description: "Subred para el Load Balancer"
    default: "10.0.1.0/24"
    required: true

  subnet_privada_cidr:
    type: string
    title: "CIDR Subred Privada"
    description: "Subred para webservers y el punto de montaje NFS (FSS)"
    default: "10.0.2.0/24"
    required: true

  ssh_public_key:
    type: string
    title: "Llave Pública SSH"
    description: "Pega tu llave pública SSH"
    required: true

  shape_webserver:
    type: oci:core:instanceshape:name
    title: "Shape del Servidor"
    description: "VM.Standard.E4.Flex es la opción más costo-eficiente para LATAM"
    default: "VM.Standard.E4.Flex"
    required: true
    dependsOn:
      compartmentId: compartment_ocid

  ocpus_webserver:
    type: number
    title: "Cantidad de OCPUs (por VM)"
    description: "Número de OCPUs para cada servidor"
    default: 1
    required: true

  memoria_webserver_gb:
    type: number
    title: "Memoria RAM (GB) (por VM)"
    description: "Cantidad de memoria RAM en GB para cada servidor"
    default: 8
    required: true

  imagen_os:
    type: string
    title: "OCID de la Imagen OS (Opcional)"
    description: "Si se deja vacía asume Oracle Linux 8"
    default: ""
    required: false

  ssh_cidr_permitido:
    type: string
    title: "CIDR Permitido para Bastion SSH"
    description: "⚠️ Restricción para solicitar túneles a OCI Bastion."
    default: "0.0.0.0/0"
    required: true

  habilitar_nsg:
    type: boolean
    title: "Usar Network Security Groups (NSG)"
    description: "✅ Mantener activado para correcto funcionamiento del FSS vía NSGs"
    default: true

  habilitar_baseline_seguridad:
    type: boolean
    title: "Activar Baseline de Seguridad OCI"
    description: "Activa Cloud Guard, Data Safe y auditoría básica. Recomendado para producción"
    default: false
