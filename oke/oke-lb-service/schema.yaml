# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  OKE LOAD BALANCER SERVICE - SCHEMA DE CONFIGURACIÓN                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

openapi: 3.0.0

info:
  title: "OKE Load Balancer Service Configuration Schema"
  version: "1.0.0"
  description: |
    Esquema de configuración para servicios Kubernetes con Load Balancer nativo
    de OCI en Oracle Kubernetes Engine.

paths: {}
components:
  schemas:
    
    OKELoadBalancerServiceConfiguration:
      type: object
      required:
        - tenancy_ocid
        - current_user_ocid
        - fingerprint
        - private_key_path
        - compartment_id
      properties:
        
        tenancy_ocid:
          type: string
          description: OCID de la tenencia
          pattern: "^ocid1\\.tenancy\\.oc1\\..+$"
        
        current_user_ocid:
          type: string
          description: OCID del usuario API
          pattern: "^ocid1\\.user\\.oc1\\..+$"
        
        fingerprint:
          type: string
          description: Fingerprint de la clave pública API
          pattern: "^[a-f0-9]{2}(:[a-f0-9]{2}){15}$"
        
        private_key_path:
          type: string
          description: Ruta a la clave privada API
        
        region:
          type: string
          description: Región de OCI
          default: "sa-santiago-1"
          enum:
            - "sa-santiago-1"
            - "sa-vinhedo-1"
            - "sa-saopaulo-1"
            - "sa-bogota-1"
            - "us-ashburn-1"
            - "us-phoenix-1"
        
        compartment_id:
          type: string
          description: OCID del compartimiento
          pattern: "^ocid1\\.compartment\\.oc1\\..+$"
        
        cluster_name:
          type: string
          description: Nombre del clúster
          default: "oke-lb-service"
          minLength: 3
          maxLength: 63
        
        cluster_version:
          type: string
          description: Versión de Kubernetes
          default: "1.29"
          enum: ["1.26", "1.27", "1.28", "1.29", "1.30"]
        
        vcn_cidr_block:
          type: string
          description: Bloque CIDR de la VCN
          default: "10.1.0.0/16"
        
        k8s_subnet_cidr:
          type: string
          description: Bloque CIDR de subred Kubernetes
          default: "10.1.1.0/24"
        
        worker_subnet_cidr:
          type: string
          description: Bloque CIDR de subred de nodos
          default: "10.1.2.0/24"
        
        lb_subnet_cidr:
          type: string
          description: Bloque CIDR de subred Load Balancer
          default: "10.1.3.0/24"
        
        node_pool_size:
          type: integer
          description: Cantidad de nodos
          default: 3
          minimum: 1
          maximum: 100
        
        node_shape:
          type: string
          description: Forma de los nodos
          default: "VM.Standard.E4.Flex"
          enum:
            - "VM.Standard.E4.Flex"
            - "VM.Standard.A1.Flex"
            - "VM.DenseIO.E5.Flex"
            - "VM.Optimized3.Flex"
        
        node_ocpus:
          type: number
          description: OCPUs por nodo
          default: 2
          minimum: 0.5
          maximum: 128
        
        node_memory_gb:
          type: number
          description: Memoria en GB por nodo
          default: 8
          minimum: 1
          maximum: 2048
        
        lb_shape:
          type: string
          description: Forma del Load Balancer
          default: "flexible"
          enum:
            - "flexible"
            - "100Mbps"
            - "400Mbps"
        
        lb_is_private:
          type: boolean
          description: Load Balancer privado
          default: false
        
        lb_min_bandwidth_mbps:
          type: integer
          description: Ancho de banda mínimo (flexible)
          default: 10
          minimum: 10
          maximum: 4000
        
        lb_max_bandwidth_mbps:
          type: integer
          description: Ancho de banda máximo (flexible)
          default: 100
          minimum: 10
          maximum: 4000
        
        ssl_certificate_ocid:
          type: string
          nullable: true
          description: OCID del certificado SSL
        
        create_backend_health_checks:
          type: boolean
          description: Crear health checks
          default: true
        
        health_check_interval_ms:
          type: integer
          description: Intervalo de health check en ms
          default: 30000
          minimum: 1000
          maximum: 300000
        
        health_check_timeout_ms:
          type: integer
          description: Timeout de health check en ms
          default: 3000
          minimum: 1000
          maximum: 60000
        
        health_check_healthy_threshold:
          type: integer
          description: Intentos exitosos para healthy
          default: 3
          minimum: 1
          maximum: 10
        
        health_check_unhealthy_threshold:
          type: integer
          description: Intentos fallidos para unhealthy
          default: 3
          minimum: 1
          maximum: 10
        
        enable_session_persistence:
          type: boolean
          description: Persistencia de sesiones
          default: true
        
        session_persistence_timeout_seconds:
          type: integer
          description: Timeout de sesión en segundos
          default: 1800
          minimum: 1
          maximum: 86400
        
        network_security_group_ids:
          type: array
          items:
            type: string
          description: IDs de NSGs
          default: []
        
        allowed_http_ports:
          type: array
          items:
            type: integer
          description: Puertos HTTP permitidos
          default: [80]
        
        allowed_https_ports:
          type: array
          items:
            type: integer
          description: Puertos HTTPS permitidos
          default: [443]
        
        environment:
          type: string
          description: Ambiente
          default: "prod"
          enum: ["dev", "staging", "prod"]
        
        project_name:
          type: string
          description: Nombre del proyecto
          default: "oke-lb-service"
        
        tags:
          type: object
          description: Etiquetas
          additionalProperties:
            type: string
        
        enable_pod_security_policy:
          type: boolean
          description: Habilitar PSP
          default: true
        
        enable_network_policy:
          type: boolean
          description: Habilitar Network Policy
          default: true
        
        enable_monitoring:
          type: boolean
          description: Habilitar monitoreo
          default: true
        
        enable_logging:
          type: boolean
          description: Habilitar logging
          default: true
        
        lb_algorithm:
          type: string
          description: Algoritmo de balanceo
          default: "ROUND_ROBIN"
          enum:
            - "ROUND_ROBIN"
            - "LEAST_CONNECTIONS"
            - "IP_HASH"
