---
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  Schema de Validación - OKE Cluster Autoscaler                              ║
# ║  Define estructura de entrada y validaciones de variables                    ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

schemaVersion: "2.0"
title: "Arquitectura OKE Cluster Autoscaler"
description: "Escalado automático de nodos y pods basado en métricas"

inputs:
  # ┌────────────────────────────────────────────────────────────────────────────┐
  # │ SECCIÓN: Autenticación OCI                                                │
  # └────────────────────────────────────────────────────────────────────────────┘
  - name: "tenancy_ocid"
    type: "string"
    required: true
    description: "OCID del Tenancy"
    sensitive: true
    pattern: "^ocid1\\.tenancy\\."

  - name: "current_user_ocid"
    type: "string"
    required: true
    description: "OCID del usuario IAM"
    sensitive: true
    pattern: "^ocid1\\.user\\."

  - name: "fingerprint"
    type: "string"
    required: true
    description: "Fingerprint de clave API"
    sensitive: true

  - name: "private_key_path"
    type: "string"
    required: true
    description: "Ruta a archivo de clave privada"
    sensitive: true

  - name: "region"
    type: "string"
    required: false
    default: "sa-santiago-1"
    description: "Región OCI de despliegue"

  # ┌────────────────────────────────────────────────────────────────────────────┐
  # │ SECCIÓN: Configuración del Cluster OKE                                    │
  # └────────────────────────────────────────────────────────────────────────────┘
  - name: "cluster_name"
    type: "string"
    required: false
    default: "oke-autoscaler-cluster"
    description: "Nombre del cluster OKE"

  - name: "kubernetes_version"
    type: "string"
    required: false
    default: "v1.29"
    description: "Versión de Kubernetes"
    allowedValues:
      - "v1.28"
      - "v1.29"
      - "v1.30"

  # ┌────────────────────────────────────────────────────────────────────────────┐
  # │ SECCIÓN: Node Pool con Autoscaling                                        │
  # └────────────────────────────────────────────────────────────────────────────┘
  - name: "node_pool_name"
    type: "string"
    required: false
    default: "pool-autoscaler"
    description: "Nombre del node pool"

  - name: "min_nodes"
    type: "integer"
    required: false
    default: 2
    description: "Número mínimo de nodos"
    minimum: 1
    maximum: 100

  - name: "max_nodes"
    type: "integer"
    required: false
    default: 10
    description: "Número máximo de nodos"
    minimum: 1
    maximum: 100

  - name: "initial_node_count"
    type: "integer"
    required: false
    default: 3
    description: "Número inicial de nodos"
    minimum: 1
    maximum: 100

  - name: "node_shape"
    type: "string"
    required: false
    default: "VM.Standard.E4.Flex"
    description: "Shape de nodos"
    allowedValues:
      - "VM.Standard.E4.Flex"
      - "VM.Standard.E5.Flex"

  - name: "node_ocpus"
    type: "integer"
    required: false
    default: 2
    description: "OCPUs por nodo"
    minimum: 1
    maximum: 64

  - name: "node_memory_gb"
    type: "integer"
    required: false
    default: 16
    description: "Memoria en GB por nodo"
    minimum: 1
    maximum: 1024

  # ┌────────────────────────────────────────────────────────────────────────────┐
  # │ SECCIÓN: Cluster Autoscaler                                               │
  # └────────────────────────────────────────────────────────────────────────────┘
  - name: "enable_cluster_autoscaler"
    type: "boolean"
    required: false
    default: true
    description: "Habilitar Cluster Autoscaler"

  - name: "autoscaler_replicas"
    type: "integer"
    required: false
    default: 2
    description: "Réplicas del Cluster Autoscaler"
    minimum: 1
    maximum: 5

  - name: "scale_down_enabled"
    type: "boolean"
    required: false
    default: true
    description: "Habilitar scale-down de nodos"

  - name: "scale_down_delay_after_add"
    type: "integer"
    required: false
    default: 10
    description: "Minutos después de agregar un nodo antes de considerar scale-down"
    minimum: 1
    maximum: 60

  - name: "scale_down_utilization_threshold"
    type: "number"
    required: false
    default: 0.65
    description: "Umbral de utilización para considerar nodo infrautilizado"
    minimum: 0.1
    maximum: 0.9

  - name: "scale_down_unneeded_time"
    type: "integer"
    required: false
    default: 10
    description: "Minutos que un nodo debe estar infrautilizado"
    minimum: 1
    maximum: 60

  # ┌────────────────────────────────────────────────────────────────────────────┐
  # │ SECCIÓN: Metrics Server y HPA                                             │
  # └────────────────────────────────────────────────────────────────────────────┘
  - name: "enable_metrics_server"
    type: "boolean"
    required: false
    default: true
    description: "Habilitar Metrics Server"

  - name: "hpa_target_cpu_utilization"
    type: "integer"
    required: false
    default: 70
    description: "Utilización de CPU objetivo para HPA (%)"
    minimum: 10
    maximum: 100

  - name: "hpa_target_memory_utilization"
    type: "integer"
    required: false
    default: 80
    description: "Utilización de memoria objetivo para HPA (%)"
    minimum: 10
    maximum: 100

  # ┌────────────────────────────────────────────────────────────────────────────┐
  # │ SECCIÓN: Configuración de VCN                                             │
  # └────────────────────────────────────────────────────────────────────────────┘
  - name: "vcn_name"
    type: "string"
    required: false
    default: "vcn-oke-autoscaler"
    description: "Nombre de la VCN"

  - name: "vcn_cidr_block"
    type: "string"
    required: false
    default: "10.0.0.0/16"
    description: "Bloque CIDR de la VCN"

  # ┌────────────────────────────────────────────────────────────────────────────┐
  # │ SECCIÓN: Monitoreo                                                        │
  # └────────────────────────────────────────────────────────────────────────────┘
  - name: "enable_monitoring"
    type: "boolean"
    required: false
    default: true
    description: "Habilitar OCI Monitoring"

  - name: "enable_prometheus"
    type: "boolean"
    required: false
    default: true
    description: "Desplegar Prometheus"

  - name: "prometheus_retention_days"
    type: "integer"
    required: false
    default: 15
    description: "Días de retención de métricas"
    minimum: 1
    maximum: 365

  # ┌────────────────────────────────────────────────────────────────────────────┐
  # │ SECCIÓN: Etiquetado                                                       │
  # └────────────────────────────────────────────────────────────────────────────┘
  - name: "tags"
    type: "object"
    required: false
    description: "Etiquetas OCI"
    default:
      ManagedBy: "Terraform"
      Proyecto: "OKE-Autoscaler"
      Autoscaling: "true"

outputs:
  - name: "cluster_id"
    description: "OCID del cluster OKE"

  - name: "node_pool_id"
    description: "OCID del node pool"

  - name: "cluster_autoscaler_release_name"
    description: "Nombre de la release de Helm"

  - name: "autoscaler_configuration"
    description: "Parámetros de autoscaling"

  - name: "hpa_configuration"
    description: "Parámetros de HPA"

  - name: "vcn_id"
    description: "OCID de la VCN"

validationRules:
  - condition: "min_nodes <= initial_node_count AND initial_node_count <= max_nodes"
    message: "initial_node_count debe estar entre min_nodes y max_nodes"

  - condition: "min_nodes < max_nodes"
    message: "max_nodes debe ser mayor que min_nodes para permitir escalado"

  - condition: "scale_down_utilization_threshold < 0.9"
    message: "El umbral debe ser menor a 0.9 para permitir scale-down"

deploymentConfig:
  estimatedCost: "medium"
  estimatedTime: "20-25 minutos"
  prerequisites:
    - "CLI de OCI instalada"
    - "Terraform >= 1.5.0"
    - "Credenciales OCI válidas"
    - "Helm 3.0+ para despliegues"
  benefits:
    - "Escalado automático de nodos"
    - "Escalado automático de pods con HPA"
    - "Optimización de costos"
    - "Alta disponibilidad automática"
