# ============================================================================
# OCI Resource Manager - Stack Schema
# Archivo para despliegue vía ORM (Oracle Resource Manager)
# ============================================================================

title: "OCI Functions - Hello World Básico"

description: |
  Arquitectura minimalista de serverless que desplega:
  - OCI Functions (hello-world en Python)
  - API Gateway con endpoint público
  - VCN y subnet para isolamiento
  - Logging y monitoring integrado
  
  Costo estimado: USD 3.85/mes (API Gateway) + invocaciones

informational_items:
  - name: "cost_estimation"
    type: "html"
    pre_content: |
      <h3>Estimación de Costos Mensuales</h3>
      <table border="1" cellpadding="10">
        <tr>
          <th>Componente</th>
          <th>Precio</th>
          <th>Notas</th>
        </tr>
        <tr>
          <td>API Gateway</td>
          <td>USD 3.65/mes</td>
          <td>Cargo fijo mensual</td>
        </tr>
        <tr>
          <td>Functions (primeras 1M/mes)</td>
          <td>Gratis</td>
          <td>Incluido en límite gratuito</td>
        </tr>
        <tr>
          <td>Logging (primeros 10GB/mes)</td>
          <td>Gratis</td>
          <td>Normalmente &lt; 100MB/mes</td>
        </tr>
        <tr>
          <td><strong>TOTAL</strong></td>
          <td><strong>USD 3.85/mes</strong></td>
          <td>Sin excedentes</td>
        </tr>
      </table>

variables:
  # ========================================================================
  # Compartment & Region (Requeridas)
  # ========================================================================
  
  compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    title: "Compartment"
    description: "Compartment donde desplegar los recursos"

  region:
    type: oci:identity:region:name
    required: true
    title: "Región OCI"
    description: "Región donde desplegar la aplicación"

  # ========================================================================
  # Application Settings
  # ========================================================================

  app_name:
    type: string
    required: true
    title: "Nombre de Aplicación"
    description: "Identificador único para la aplicación (solo minúsculas, guiones)"
    default: "hello-world-app"
    minLength: 3
    maxLength: 20
    pattern: "^[a-z][a-z0-9-]*[a-z0-9]$"

  environment:
    type: enum
    required: true
    title: "Entorno"
    description: "Etapa de despliegue"
    default: "dev"
    enum:
      - "dev"
      - "test"
      - "prod"

  # ========================================================================
  # Function Configuration
  # ========================================================================

  function_name:
    type: string
    required: false
    title: "Nombre de la Función"
    description: "Nombre de la función serverless"
    default: "hello-world"
    minLength: 1
    maxLength: 30

  function_memory:
    type: enum
    required: false
    title: "Memoria de Función (MB)"
    description: "Cantidad de memoria asignada a la función"
    default: "128"
    enum:
      - "128"
      - "256"
      - "512"
      - "1024"
      - "2048"

  function_timeout:
    type: integer
    required: false
    title: "Timeout de Ejecución (segundos)"
    description: "Máximo tiempo de ejecución de la función"
    default: 30
    minimum: 1
    maximum: 300

  # ========================================================================
  # Networking Configuration
  # ========================================================================

  vcn_cidr_block:
    type: string
    required: false
    title: "VCN CIDR Block"
    description: "Bloque CIDR para la red virtual"
    default: "10.0.0.0/16"
    pattern: "^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}/[0-9]{1,2}$"

  subnet_cidr_block:
    type: string
    required: false
    title: "Subnet CIDR Block"
    description: "Bloque CIDR para la subnet pública"
    default: "10.0.1.0/24"
    pattern: "^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}/[0-9]{1,2}$"

  # ========================================================================
  # Monitoring & Observability
  # ========================================================================

  enable_monitoring:
    type: boolean
    required: false
    title: "Habilitar Monitoreo"
    description: "Crear dashboards y alertas"
    default: true

  enable_detailed_logs:
    type: boolean
    required: false
    title: "Logs Detallados"
    description: "Capturar todos los logs de invocación"
    default: true

  log_retention_days:
    type: integer
    required: false
    title: "Retención de Logs (días)"
    description: "Días para mantener logs antes de eliminar"
    default: 30
    minimum: 1
    maximum: 3650

  # ========================================================================
  # Budget & Cost
  # ========================================================================

  budget_alert_amount:
    type: number
    required: false
    title: "Presupuesto Mensual (USD)"
    description: "Monto para generar alertas de gasto"
    default: 50
    minimum: 1
    maximum: 10000

  budget_alert_threshold_percentage:
    type: integer
    required: false
    title: "Umbral de Alerta (%)"
    description: "Porcentaje del presupuesto para alertar"
    default: 80
    minimum: 1
    maximum: 100

  # ========================================================================
  # API Gateway
  # ========================================================================

  api_gateway_stage:
    type: string
    required: false
    title: "API Gateway Stage"
    description: "Nombre del stage (fase) del API"
    default: "prod"
    minLength: 1
    maxLength: 20

  api_gateway_enable_metrics:
    type: boolean
    required: false
    title: "Habilitar Métricas API"
    description: "Recopilar métricas de uso del API"
    default: true

  api_gateway_logging_level:
    type: enum
    required: false
    title: "Nivel de Logging API"
    description: "Verbosidad de logs del API Gateway"
    default: "INFO"
    enum:
      - "FATAL"
      - "ERROR"
      - "WARNING"
      - "INFO"
      - "DEBUG"

outputGroups:
  - title: "API Gateway Endpoints"
    outputs:
      - api_endpoint
      - function_invocation_example

  - title: "Function Information"
    outputs:
      - function_id
      - function_arn
      - function_invoke_endpoint

  - title: "Logging & Monitoring"
    outputs:
      - log_group_id
      - view_logs_command

  - title: "Cost Estimate"
    outputs:
      - estimated_monthly_cost
      - cost_breakdown
